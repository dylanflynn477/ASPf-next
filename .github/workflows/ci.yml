name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests research benchmarks
      - run: ruff check src tests research benchmarks
      - run: mypy src
      - run: mypy --strict --explicit-package-bases research/native_backend
      - run: mypy --strict benchmarks
      - run: pytest
      - name: Historical compatibility corpus
        run: pytest tests/historical_compat -rxX
      - name: Compatibility report
        run: python scripts/compatibility_report.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install dist/aspf_next-*.whl
      - name: Smoke-test installed CLI
        run: |
          .smoke-venv/bin/aspf --version
          .smoke-venv/bin/aspf examples/01_basic_assignment.aspf
