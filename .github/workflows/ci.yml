name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests research benchmarks
      - run: ruff check src tests research benchmarks
      - run: mypy src
      - run: mypy --strict --explicit-package-bases research/native_backend
      - run: mypy --strict benchmarks
      - run: pytest
      - name: Historical compatibility corpus
        run: pytest tests/historical_compat -rxX
      - name: Compatibility report
        run: python scripts/compatibility_report.py
