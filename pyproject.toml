[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aspf-next"
version = "0.2.0a1"
description = "Experimental clean-room ASP{f} compatibility frontend for Clingo 5.8"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dylan Flynn" }]
keywords = [
  "answer-set-programming",
  "asp",
  "clingo",
  "logic-programming",
  "non-herbrand-functions",
  "research-software",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["clingo>=5.8,<5.9"]

[project.urls]
Homepage = "https://github.com/dylanflynn477/ASPf-next"
Repository = "https://github.com/dylanflynn477/ASPf-next"
Documentation = "https://github.com/dylanflynn477/ASPf-next/tree/main/docs"
Issues = "https://github.com/dylanflynn477/ASPf-next/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
aspf = "aspf_next.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aspf_next"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aspf_next"]
